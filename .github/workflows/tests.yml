name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ["20.x", "22.x", "24.x"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Verify the package builds
        run: npm run build

      - name: Exercise the composite Action
        id: comparison
        uses: ./
        with:
          before: test/fixtures/resources-before.json
          after: test/fixtures/resources-after.json
          node-version: ${{ matrix.node-version }}

      - name: Verify Action outputs
        shell: bash
        env:
          DIFF_EXIT_CODE: ${{ steps.comparison.outputs.exit-code }}
          REPORT_DIRECTORY: ${{ steps.comparison.outputs.report-directory }}
        run: |
          test "$DIFF_EXIT_CODE" = 1
          test -f "$REPORT_DIRECTORY/diff.json"
          test -f "$REPORT_DIRECTORY/diff.html"
          test -f "$REPORT_DIRECTORY/comment.md"
