name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}

      - name: Record the selected commit
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.x"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm ci

      - name: Verify version matches release tag
        env:
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$PKG" ]; then
            echo "ERROR: release tag $TAG does not match package.json version $PKG." >&2
            echo "Bump the version before cutting the release." >&2
            exit 1
          fi
          echo "OK: tag $TAG matches package.json version $PKG"

      - name: Typecheck, lint, format and test
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm test

      - name: Pack
        run: npm pack

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tarball
          path: "*.tgz"

  publish:
    needs: build
    if: vars.PUBLISH_TO_NPM == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.build.outputs.commit }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.x"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm ci

      # npm >= 11.5.1 publishes with a provenance attestation via OIDC when
      # id-token: write is granted. NODE_AUTH_TOKEN is still needed unless the
      # package is configured for trusted publishing on npmjs.com.
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
